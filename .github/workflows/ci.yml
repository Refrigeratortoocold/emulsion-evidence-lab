name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run meaningful offline tests
        run: python -m unittest discover -s tests -v
      - name: Exercise the complete demo
        run: |
          python app.py extract --input data/demo_documents.jsonl --provider baseline --output outputs/demo
          python app.py evaluate --predictions outputs/demo/results.jsonl --gold data/demo_gold.json --output outputs/demo/evaluation.json
