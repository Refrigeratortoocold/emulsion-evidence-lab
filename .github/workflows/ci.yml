name: Protein design verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify sequence, ranking and evaluation behaviour
        run: python -m unittest discover -s tests -v
      - name: Run the complete offline demo
        run: python app.py demo --output outputs/demo
